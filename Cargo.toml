[package]
name = "gemini-assist-rs"
version = "1.1.1-beta"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
napi-build = "2"

[dependencies]
napi = { version = "3", features = ["napi8", "tokio_rt", "serde-json"] }
napi-derive = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
